name: IAT Phase 3A Observable-Only Pipeline

on:
  workflow_dispatch:
    inputs:
      full_null_calibration:
        description: "Run all 1,000 synthetic null replicates"
        type: boolean
        default: true
      adversarial_replicates:
        description: "Adversarial falsification replicates"
        required: false
        default: "100"
  pull_request:
    branches: [main]
    paths:
      - "src/phase3a_*"
      - "config/phase3a_spec.yaml"
      - "tests/test_phase3a.py"
      - "docs/phase3a_*"
      - "data/phase3a/**"
      - ".github/workflows/phase3a.yml"
  push:
    branches: [main]
    paths:
      - "src/phase3a_*"
      - "config/phase3a_spec.yaml"
      - "tests/test_phase3a.py"
      - "docs/phase3a_*"
      - "data/phase3a/**"
      - ".github/workflows/phase3a.yml"

permissions:
  contents: read

concurrency:
  group: phase3a-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preregistration-and-falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Record preregistration hashes
        run: |
          sha256sum \
            config/phase3a_spec.yaml \
            docs/phase3a_preregistration.md \
            docs/phase3a_adversarial_falsification.md \
            src/phase3a_core.py \
            src/phase3a_core_hardened.py \
            src/phase3a_core_hardened_r2.py \
            src/phase3a_prepare.py \
            src/phase3a_analyze.py \
            src/phase3a_null_calibration.py \
            src/phase3a_adversarial_falsification.py \
            src/phase3a_validator.py \
            tests/test_phase3a.py | tee phase3a_hashes.txt
      - name: Unit tests
        run: pytest -q tests/test_phase3a.py
      - name: Simple null calibration
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.full_null_calibration }}" == "true" ]]; then
            N=1000
          else
            N=100
          fi
          python src/phase3a_null_calibration.py --replicates "$N"
      - name: Adversarial falsification regression suite r2
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            N="${{ inputs.adversarial_replicates }}"
          else
            N=20
          fi
          python src/phase3a_adversarial_falsification.py --replicates "$N" --out results/phase3a/adversarial_falsification_r2.json
      - name: Analyze committed hardware data when present
        if: ${{ hashFiles('data/phase3a/trials.csv') != '' }}
        run: |
          python src/phase3a_analyze.py --data data/phase3a/trials.csv
          python src/phase3a_validator.py
      - name: Publish summary
        if: always()
        run: |
          cat results/phase3a/null_calibration/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          if [ -f results/phase3a/adversarial_falsification_r2.json ]; then
            echo '## Adversarial falsification r2' >> "$GITHUB_STEP_SUMMARY"
            cat results/phase3a/adversarial_falsification_r2.json >> "$GITHUB_STEP_SUMMARY"
          fi
          cat results/phase3a/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IAT-Phase3A-preregistration-and-falsification
          path: |
            phase3a_hashes.txt
            results/phase3a/
            config/phase3a_spec.yaml
            docs/phase3a_preregistration.md
            docs/phase3a_adversarial_falsification.md
            reports/Phase3A/adversarial_falsification_r1.json
            reports/Phase3A/adversarial_falsification_r2.json
          if-no-files-found: warn
          retention-days: 90
